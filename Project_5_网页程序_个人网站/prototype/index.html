  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --accent: #05b0ff;
      --wash: #eef7ff;
      --accent-shadow: rgba(5, 176, 255, 0.12);
      --ink: #222;
      --muted: #999;
      --line: rgba(34, 34, 34, 0.08);
      --content-width: 800px;
      --wide-width: 1180px;
      --nav-height: 68px;
      color: var(--ink);
      font-family: BlinkMacSystemFont, "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      margin-bottom: calc(-1 * (var(--nav-height) + 1px));
      border-bottom: 1px solid transparent;
      background: transparent;
      transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, backdrop-filter 180ms ease;
    }

    .site-header.is-scrolled {
      border-bottom-color: rgba(255, 255, 255, 0.38);
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      box-shadow: 0 0.45em 1.2em rgba(34, 34, 34, 0.06);
    }

    .site-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: var(--nav-height);
      font-size: 24px;
      font-weight: 200;
      line-height: 1;
    }

    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
      min-height: var(--nav-height);
      padding: 0 1em;
      color: #333;
      transition: color 180ms ease, background 180ms ease;
    }

    .nav-visual {
      position: relative;
      width: 1.05em;
      height: 1.05em;
      flex: 0 0 auto;
    }

    .nav-geometry,
    .nav-icon {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .nav-geometry {
      border-radius: 999px;
      background: color-mix(in srgb, var(--tone-color), #fff 38%);
      box-shadow: inset 0 0 0 0.18em rgba(255, 255, 255, 0.75);
    }

    .nav-icon {
      object-fit: cover;
      border-radius: 0.2em;
    }

    .nav-link[data-tone="projects"] .nav-geometry {
      border-radius: 0.28em;
      transform: rotate(8deg);
    }

    .nav-link[data-tone="links"] .nav-geometry {
      border-radius: 0.16em;
      background:
        linear-gradient(90deg, transparent 36%, rgba(255, 255, 255, 0.8) 36%, rgba(255, 255, 255, 0.8) 64%, transparent 64%),
        color-mix(in srgb, var(--tone-color), #fff 36%);
    }

    .nav-link.is-active {
      background: var(--tone-wash);
      color: var(--tone-color);
    }

    .nav-link.is-active .nav-text {
      font-weight: 400;
    }

    .nav-link:hover {
      background: var(--tone-wash);
      color: var(--tone-color);
    }

    .nav-text {
      font-weight: 200;
    }

    .view {
      display: none;
      min-height: 100vh;
      background: linear-gradient(var(--wash), #fff) repeat-x top left;
      background-size: 100% 300px;
      opacity: 0;
      transform: translateY(10px);
    }

    .view.is-active {
      display: block;
      animation: view-in 220ms ease forwards;
    }

    .view.links-view.is-active {
      display: flex;
      flex-direction: column;
      overflow: clip;
    }

    .layout {
      width: min(var(--content-width), calc(100% - 40px));
      margin: 0 auto;
    }

    .hero {
      padding: 9.5em 0 8em;
      text-align: center;
    }

    .avatar-mark {
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      width: 15em;
      height: 15em;
      margin: 0 auto;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.96) 0 18%, transparent 19%),
        linear-gradient(135deg, color-mix(in srgb, var(--accent), #fff 30%), color-mix(in srgb, var(--accent), #fff 72%));

    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }

    .hero h1 {
      margin: 0;
      padding: 0.34em 0 0.1em;
      font-size: clamp(48px, 9vw, 72px);
      font-weight: 200;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .hero p {
      margin: 0;
      color: rgba(34, 34, 34, 0.5);
      font-size: 1.6em;
      font-weight: 200;
    }

    .summary {
      padding: 1em 0 9em;
      color: #666;
      font-size: 1.4em;
      font-weight: 200;
      line-height: 1.45;
    }

    .wave-divider {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 6.5em;
      margin-top: -3.25em;
      overflow: hidden;
      pointer-events: none;
    }

    .wave-divider svg {
      display: block;
      width: calc(100% + 48px);
      height: 100%;
      margin-left: -24px;
      overflow: visible;
    }

    .wave-soften {
      filter: url(#wave-soften);
    }

    .wave-fill-back {
      fill: color-mix(in srgb, var(--accent), #fff 88%);
      opacity: 0.9;
    }

    .wave-fill-front {
      fill: color-mix(in srgb, var(--accent), #fff 95%);
      opacity: 0.92;
    }

    .summary p {
      margin: 0;
      padding: 0.8em 0;
      text-wrap: pretty;
    }

    .summary strong,
    .summary b {
      color: #333;
      font-weight: 400;
    }

    .summary-link {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    .summary-shell {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent), #fff 95%) 0%, color-mix(in srgb, var(--accent), #fff 97%) 100%);
      margin-top: -14px;
      padding-top: 14px;
    }

    .page-head {
      padding: 5.2em 0 2em;
      text-align: center;
    }

    .page-head h1 {
      margin: 0;
      color: var(--accent);
      font-size: 2.4em;
      font-weight: 200;
      line-height: 1.2;
    }

    .page-head p {
      margin: 0.6em 0 0;
      color: var(--muted);
      font-size: 1.1em;
      font-weight: 200;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1.1em;
      padding: 1em 0 4em;
      text-align: center;
    }

    .project-card {
      display: block;
      width: 100%;
      min-height: 13em;
      padding: 1.8em 0.8em;
      border: 0;
      background: transparent;
      border-radius: 8px;
      color: var(--accent);
      font: inherit;
      text-align: center;
      transition: background 180ms ease, transform 180ms ease;
    }

    .project-card:hover {
      background: color-mix(in srgb, var(--wash), #fff 45%);
      transform: translateY(-2px);
    }

    .project-icon {
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      width: 7em;
      height: 7em;
      margin: 0 auto 1em;
      border-radius: 1.6em;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent), #fff 22%), color-mix(in srgb, var(--accent), #fff 72%));
      box-shadow: 0 0.5em 2em var(--accent-shadow);
    }

    .project-image,
    .plain-item-image,
    .link-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-card h2,
    .link-card h2 {
      margin: 0;
      font-weight: 300;
      text-wrap: pretty;
    }

    .project-card h2 {
      font-size: 1.7em;
    }

    .link-card p {
      margin: 0.4em 0 0;
      color: var(--muted);
      font-weight: 200;
    }

    .project-section {
      padding: 2.5em 0;
    }

    .project-section h2 {
      margin: 0;
      padding: 0 1.3em 0.8em;
      color: #222;
      font-size: 2em;
      font-weight: 200;
      text-align: center;
    }

    .project-list {
      display: grid;
      gap: 0.15em;
    }

    .project-item {

    }

    .project-summary {

      color: #666;
      font-size: 1.15em;
      font-weight: 200;
      line-height: 1.55;
      white-space: pre-line;
      text-wrap: pretty;
    }

    .project-visit-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
      margin-top: 1.1em;
      color: var(--accent);
      font-size: 0.95em;
      font-weight: 300;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    .project-visit-link::after {
      content: "→";
      text-decoration: none;
    }

    .project-detail-carousel {
      display: grid;
      gap: 0.7em;
    }

    .project-detail-media {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent), #fff 26%), color-mix(in srgb, var(--accent), #fff 76%));
      box-shadow: 0 0.45em 1.6em var(--accent-shadow);
    }

    .project-detail-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-carousel-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 2.8em;
      color: var(--muted);
      font-size: 0.95em;
      font-weight: 300;
    }

    .project-carousel-button {
      display: grid;
      place-items: center;
      width: 2.8em;
      height: 2.8em;
      border-radius: 999px;
      background: color-mix(in srgb, var(--wash), #fff 25%);
      color: var(--accent);
      font-size: 1em;
      line-height: 1;
      transition: background 180ms ease, transform 180ms ease;
    }

    .project-carousel-button:hover {
      background: color-mix(in srgb, var(--accent), #fff 84%);
      transform: translateY(-1px);
    }

    .project-image-caption {
      min-height: 1.45em;
      margin: 0;
      color: var(--muted);
      font-size: 0.95em;
      font-weight: 200;
      line-height: 1.45;
      text-align: center;
      text-wrap: pretty;
    }

    .project-image-caption.is-empty {
      visibility: hidden;
    }

    .link-section {
      padding: 2.5em 0;
    }

    .link-section h2 {
      margin: 0;
      padding: 0 1.3em 0.8em;
      color: #222;
      font-size: 2em;
      font-weight: 200;
      text-align: center;
    }

    .plain-list {
      display: grid;
      gap: 0.15em;
    }

    .plain-list a {
      display: flex;
      align-items: center;
      gap: 1.1em;
      padding: 0.85em 1.6em 0.8em;
      border-radius: 5px;
      color: var(--accent);
      transition: background 180ms ease;
    }

    .plain-item-visual {
      position: relative;
      flex: 0 0 4.5em;
      width: 4.5em;
      height: 4.5em;
      overflow: hidden;
      border-radius: 1em;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent), #fff 28%), color-mix(in srgb, var(--accent), #fff 76%));
      box-shadow: 0 0.4em 1.4em var(--accent-shadow);
    }

    .plain-item-copy {
      min-width: 0;
    }

    .plain-list a:hover {
      background: color-mix(in srgb, var(--wash), #fff 48%);
    }

    .plain-list h3 {
      margin: 0;
      font-size: 1.55em;
      font-weight: 300;
      line-height: 1.25;
    }

    .plain-list p {
      margin: 0.25em 0 0;
      color: var(--muted);
      font-weight: 200;
    }

    .links-list {
      display: grid;
      gap: 3.2em;
      padding: 1em 0 3em;
    }

    .links-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding-bottom: 3em;
    }

    .link-group {
      display: grid;
      gap: 0.9em;
    }

    .link-group-title {
      margin: 0;
      padding: 0 0 0.6em;
      border-bottom: 1px solid var(--line);
      color: #222;
      font-size: 1.7em;
      font-weight: 200;
      text-align: left;
    }

    .link-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 0.9em;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 7em;
      padding: 1em 1em 1em 6.5em;
      border-radius: 8px;
      color: var(--accent);
      transition: background 180ms ease;
    }

    .link-card:hover {
      background: color-mix(in srgb, var(--wash), #fff 42%);
    }

    .link-card.is-disabled {
      cursor: default;
    }

    .link-avatar {
      position: absolute;
      overflow: hidden;
      display: grid;
      place-items: center;
      left: 1em;
      top: 1em;
      width: 4.8em;
      height: 4.8em;
      border-radius: 999px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent), #fff 30%), color-mix(in srgb, var(--accent), #fff 78%));
      box-shadow: 0 0.5em 2em var(--accent-shadow);
    }

    .link-image {
      border-radius: inherit;
    }

    .link-card-copy {
      display: block;
      min-width: 0;
    }

    .link-card-title,
    .link-card-description {
      display: block;
    }

    .link-card-title {
      font-size: 1.45em;
      font-weight: 300;
      line-height: 1.2;
    }

    .link-card-description {
      margin-top: 0.35em;
      color: var(--muted);
      font-weight: 200;
      text-wrap: pretty;
    }

    .links-contact-strip {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.45em 1.3em;
      margin: auto auto 0;
      padding-top: 0.9em;
      border-top: 1px solid color-mix(in srgb, var(--line), transparent 30%);
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 0.55em;
      min-height: 2.2em;
      padding: 0.1em 0;
      color: var(--muted);
      font-size: 0.9em;
      transition: color 180ms ease;
    }

    .contact-hover-media {
      position: absolute;
      z-index: 4;
      left: var(--contact-preview-x, 50%);
      bottom: 100%;
      display: block;
      width: min(22em, calc(100vw - 40px));
      padding: 0;
      border: 1px solid color-mix(in srgb, var(--line), transparent 15%);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 -0.35em 0.9em rgba(34, 34, 34, 0.12);
      pointer-events: none;
      transform: translate(-50%, 0);
    }

    .contact-hover-media[hidden] {
      display: none;
    }

    .contact-hover-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: inherit;
    }

    .contact-row:hover {
      color: var(--accent);
    }

    .contact-icon {
      position: relative;
      flex: 0 0 1.35em;
      width: 1.35em;
      height: 1.35em;
      border: 0.12em solid currentColor;
      border-radius: 0.28em;
      opacity: 0.85;
    }

    .contact-icon.is-custom {
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      opacity: 1;
    }

    .contact-icon-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .contact-icon[data-kind="email"]::after {
      position: absolute;
      left: 0.16em;
      top: 0.17em;
      width: 0.72em;
      height: 0.72em;
      border-right: 0.11em solid currentColor;
      border-bottom: 0.11em solid currentColor;
      transform: rotate(45deg) skew(-8deg, -8deg);
      content: "";
    }

    .contact-icon[data-kind="wechat"] {
      border-radius: 999px;
    }

    .contact-icon[data-kind="wechat"]::before,
    .contact-icon[data-kind="wechat"]::after {
      position: absolute;
      border: 0.1em solid currentColor;
      border-radius: 999px;
      content: "";
    }

    .contact-icon[data-kind="wechat"]::before {
      left: 0.12em;
      top: 0.16em;
      width: 0.66em;
      height: 0.52em;
    }

    .contact-icon[data-kind="wechat"]::after {
      right: 0.1em;
      bottom: 0.12em;
      width: 0.5em;
      height: 0.4em;
      background: #fff;
    }

    .contact-icon[data-kind="feishu"] {
      border-radius: 0.48em 0.48em 0.48em 0.12em;
      transform: rotate(-12deg);
    }

    .contact-icon[data-kind="feishu"]::after {
      position: absolute;
      left: 0.28em;
      top: 0.25em;
      width: 0.48em;
      height: 0.48em;
      border-radius: 999px;
      background: currentColor;
      content: "";
    }

    .contact-icon[data-kind="steam"] {
      border-radius: 999px;
    }

    .contact-icon[data-kind="steam"]::before {
      position: absolute;
      right: -0.02em;
      top: 0.16em;
      width: 0.54em;
      height: 0.54em;
      border: 0.1em solid currentColor;
      border-radius: 999px;
      background: #fff;
      content: "";
    }

    .contact-icon[data-kind="steam"]::after {
      position: absolute;
      left: 0.14em;
      bottom: 0.18em;
      width: 0.66em;
      height: 0.12em;
      border-radius: 999px;
      background: currentColor;
      transform: rotate(-34deg);
      transform-origin: left center;
      content: "";
    }

    .contact-copy {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.4em;
      min-width: 0;
    }

    .contact-label {
      flex: 0 0 auto;
      color: #333;
      font-weight: 300;
    }

    .contact-value {
      min-width: 0;
      color: var(--muted);
      font-weight: 200;
      overflow-wrap: anywhere;
    }

    @keyframes view-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 680px) {
      :root {
        --nav-height: 62px;
      }

      .site-nav {
        font-size: 28px;
      }

      .nav-link {
        padding: 0 0.65em;
      }

      .nav-text {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .hero {
        padding: 6em 0 5em;
      }

      .avatar-mark {
        width: 10em;
        height: 10em;
      }

      .wave-divider {
        height: 5em;
        margin-top: -2.2em;
      }

      .hero p {
        font-size: 1.35em;
      }

      .summary {
        padding-bottom: 6em;
        font-size: 1.18em;
      }

      .page-head {
        padding-top: 3em;
      }

      .project-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .project-summary {
        padding-left: 1em;
        padding-right: 1em;
      }

      .project-summary-visual {
        flex-basis: 3.8em;
        width: 3.8em;
        height: 3.8em;
      }

      .project-detail {
        padding-left: 1em;
        padding-right: 1em;
      }

      .plain-list a {
        padding-left: 1em;
        padding-right: 1em;
      }

      .plain-item-visual {
        flex-basis: 3.8em;
        width: 3.8em;
        height: 3.8em;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" id="site-nav" aria-label="主导航"></nav>
  </header>

  <main id="app"></main>

  <script>
    const config = window.CONFIG;
    const root = document.documentElement;
    const app = document.querySelector("#app");
    const nav = document.querySelector("#site-nav");
    const header = document.querySelector(".site-header");
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
    const state = {
      activeView: config.initialView,
      expandedProjectId: null,
      projectImageIndexes: {}
    };
    let waveAnimationFrame = 0;

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function disabledLink(content, className) {
      return `<a class="${className}" href="#" data-disabled="true" aria-disabled="true">${content}</a>`;
    }

    function renderOptionalImage(src, className, alt, loading = "lazy") {
      if (!src) return "";
      return `<img class="${className}" src="${escapeHTML(src)}" alt="${escapeHTML(alt)}" loading="${loading}" decoding="async" data-fallback>`;
    }

    function renderNav() {
      nav.innerHTML = config.nav.map((item) => {
        const theme = config.themes[item.tone];
        const isActive = item.id === state.activeView;
        const icon = renderOptionalImage(item.iconSrc, "nav-icon", "", "eager");
        return `
          <button
            class="nav-link${isActive ? " is-active" : ""}"
            type="button"
            data-target="${escapeHTML(item.id)}"
            data-tone="${escapeHTML(item.tone)}"
            aria-label="${escapeHTML(item.label)}"
            aria-current="${isActive ? "page" : "false"}"
            style="--tone-color: ${escapeHTML(theme.accent)}; --tone-wash: ${escapeHTML(theme.wash)};"
          >
            <span class="nav-visual">
              <span class="nav-geometry" aria-hidden="true"></span>
              ${icon}
            </span>
            <span class="nav-text">${escapeHTML(item.label)}</span>
          </button>
        `;
      }).join("");
    }

    function renderHomeView(page) {
      const summary = page.summary.map((item) => {
        const lead = item.lead ? `<strong>${escapeHTML(item.lead)}</strong> ` : "";
        const link = item.linkText
          ? ` <a href="#${escapeHTML(item.linkTarget)}" class="summary-link" data-view-link="${escapeHTML(item.linkTarget)}">${escapeHTML(item.linkText)}</a>`
          : "";
        return `<p>${lead}${escapeHTML(item.text)}${link}</p>`;
      }).join("");

      return `
        <section class="view" data-view="home" aria-labelledby="home-title" hidden>
          <div class="hero">
            <div class="avatar-mark">
              ${renderOptionalImage(page.avatarSrc, "avatar-image", `${page.name}的头像`, "eager")}
            </div>
            <h1 id="home-title">${escapeHTML(page.name)}</h1>
            <p>${escapeHTML(page.role)}</p>
          </div>
          <div class="wave-divider" aria-hidden="true">
            <svg viewBox="0 0 1200 100" preserveAspectRatio="none" role="presentation">
              <defs>
                <filter id="wave-soften" x="-10%" y="-30%" width="120%" height="160%">
                  <feGaussianBlur stdDeviation="0.55"></feGaussianBlur>
                </filter>
              </defs>
              <path class="wave-fill-back wave-soften" data-wave="back" d=""></path>
              <path class="wave-fill-front wave-soften" data-wave="front" d=""></path>
            </svg>
          </div>
          <div class="summary-shell">
            <div class="summary layout">${summary}</div>
          </div>
        </section>
      `;
    }

    function renderProjectCard(item) {
      return `
        <button class="project-card" type="button" data-featured-target="${escapeHTML(item.id)}" aria-label="${escapeHTML(item.title)}">
        <div class="project-icon">
          ${renderOptionalImage(item.imageSrc, "project-image", item.title)}
        </div>
        <h2>${escapeHTML(item.title)}</h2>
        </button>
      `;
    }

    function getProjectImages(item) {
      return Array.isArray(item?.detail?.images) ? item.detail.images : [];
    }

    function renderProjectDetail(item) {
      const images = getProjectImages(item);
      const imageIndex = images.length ? getWrappedImageIndex(state.projectImageIndexes[item.id] || 0, images.length) : 0;
      const image = images[imageIndex];
      const hasMultipleImages = images.length > 1;
      const imageCaption = image?.description || "";
      const visitLink = item.websiteUrl
        ? `<a class="project-visit-link" data-project-visit href="${escapeHTML(item.websiteUrl)}" target="_blank" rel="noopener noreferrer">前往查看</a>`
        : "";
      const controls = hasMultipleImages
        ? `
            <div class="project-carousel-controls">
              <button class="project-carousel-button" type="button" data-project-image="prev" data-carousel-project-id="${escapeHTML(item.id)}" aria-label="上一张图片" title="上一张图片">←</button>
              <span class="project-image-counter" data-image-counter>第 ${imageIndex + 1} / ${images.length} 张</span>
              <button class="project-carousel-button" type="button" data-project-image="next" data-carousel-project-id="${escapeHTML(item.id)}" aria-label="下一张图片" title="下一张图片">→</button>
            </div>
          `
        : images.length
          ? `<div class="project-carousel-controls"><span class="project-image-counter" data-image-counter>第 1 / 1 张</span></div>`
          : "";

      return `
        <div class="project-detail-inner">
          <div class="project-detail-copy">
            <p>${escapeHTML(item.detail?.description || "")}</p>
            ${visitLink}
          </div>
          <div class="project-detail-carousel" data-project-carousel>
            <div class="project-detail-media" data-project-media>
              ${images.length && image ? renderOptionalImage(image.src, "project-detail-image", image.alt || item.title) : ""}
            </div>
            ${controls}
            <p class="project-image-caption${imageCaption ? "" : " is-empty"}" data-image-caption>${escapeHTML(imageCaption)}</p>
          </div>
        </div>
      `;
    }

    function renderPlainItem(item) {
      return `
        <article class="project-item" data-project-id="${escapeHTML(item.id)}">
          <button class="project-summary" type="button" data-project-toggle="${escapeHTML(item.id)}" aria-expanded="false">
            <span class="project-summary-visual">
              ${renderOptionalImage(item.imageSrc, "plain-item-image", item.title)}
            </span>
            <span class="project-summary-copy">
              <span class="project-summary-title">${escapeHTML(item.title)}</span>
              <span class="project-summary-description">${escapeHTML(item.description)}</span>
            </span>
          </button>
          <div class="project-detail" data-project-detail hidden>
            ${renderProjectDetail(item)}
          </div>
        </article>
      `;
    }

    function renderProjectsView(page) {
      const items = Array.isArray(page.items) ? page.items : [];
      const featured = items.filter((item) => item.isFeatured).map(renderProjectCard).join("");
      const sections = page.sections.map((section) => {
        const sectionItems = items.filter((item) => item.category === section.id);
        if (!sectionItems.length) return "";

        return `
        <section class="project-section layout" aria-label="${escapeHTML(section.title)}">
          <h2>${escapeHTML(section.title)}</h2>
          <div class="project-list">${sectionItems.map(renderPlainItem).join("")}</div>
        </section>
        `;
      }).join("");

      return `
        <section class="view" data-view="projects" aria-labelledby="projects-title" hidden>
          <div class="page-head layout">
            <h1 id="projects-title">${escapeHTML(page.title)}</h1>
            <p>${escapeHTML(page.subtitle)}</p>
          </div>
          <div class="project-grid layout" aria-label="代表作">${featured}</div>
          ${sections}
        </section>
      `;
    }

    function renderLinkCard(item) {
      const content = `
        <span class="link-avatar">
          ${renderOptionalImage(item.imageSrc, "link-image", item.title)}
        </span>
        <span class="link-card-copy">
          <span class="link-card-title">${escapeHTML(item.title)}</span>
          <span class="link-card-description">${escapeHTML(item.description)}</span>
        </span>
      `;

      if (!item.url) {
        return `<div class="link-card is-disabled" aria-disabled="true">${content}</div>`;
      }

      return `<a class="link-card" data-external-link href="${escapeHTML(item.url)}" target="_blank" rel="noopener noreferrer">${content}</a>`;
    }

    function renderContactRow(item) {
      const icon = item.iconSrc
        ? `<span class="contact-icon is-custom" aria-hidden="true">${renderOptionalImage(item.iconSrc, "contact-icon-image", "")}</span>`
        : `<span class="contact-icon" data-kind="${escapeHTML(item.kind || "default")}" aria-hidden="true"></span>`;
      const content = `
        ${icon}
        <span class="contact-copy">
          <span class="contact-label">${escapeHTML(item.label)}</span>
          <span class="contact-value">${escapeHTML(item.value)}</span>
        </span>
      `;

      if (!item.href) {
        return `<div class="contact-row" data-contact-row data-contact-preview-target="${escapeHTML(item.kind || "default")}" aria-disabled="true">${content}</div>`;
      }

      return `<a class="contact-row" data-contact-row data-contact-preview-target="${escapeHTML(item.kind || "default")}" href="${escapeHTML(item.href)}">${content}</a>`;
    }

    function renderContactHoverPreview(item) {
      if (!item.hoverImageSrc) return "";
      return `<span class="contact-hover-media" data-contact-hover data-contact-preview="${escapeHTML(item.kind || "default")}" hidden>${renderOptionalImage(item.hoverImageSrc, "contact-hover-image", item.hoverImageAlt || item.label, "eager")}</span>`;
    }

    function renderLinkGroup(id, title, items, contentClass, renderer) {
      if (!Array.isArray(items) || !items.length) return "";

      return `
        <section class="link-group" data-link-group="${escapeHTML(id)}" aria-labelledby="${escapeHTML(id)}-title">
          <h2 class="link-group-title" id="${escapeHTML(id)}-title">${escapeHTML(title)}</h2>
          <div class="${contentClass}">${items.map(renderer).join("")}</div>
        </section>
      `;
    }

    function renderLinksView(page) {
      const contacts = Array.isArray(page.contacts) && page.contacts.length
        ? `<div class="links-contact-strip" data-links-contacts aria-label="联系方式">${page.contacts.map(renderContactRow).join("")}${page.contacts.map(renderContactHoverPreview).join("")}</div>`
        : "";
      const groups = [
        renderLinkGroup("my-homepages", "我的主页", page.myHomepages, "link-card-grid", renderLinkCard)
      ].join("");

      return `
        <section class="view links-view" data-view="links" aria-labelledby="links-title" hidden>
          <div class="page-head layout">
            <h1 id="links-title">${escapeHTML(page.title)}</h1>
            <p>${escapeHTML(page.subtitle)}</p>
          </div>
          <div class="links-content layout">
            <div class="links-list">${groups}</div>
            ${contacts}
          </div>
        </section>
      `;
    }

    function applyTheme(viewId) {
      const navItem = config.nav.find((item) => item.id === viewId) || config.nav[0];
      const theme = config.themes[navItem.tone];
      root.style.setProperty("--accent", theme.accent);
      root.style.setProperty("--wash", theme.wash);
      root.style.setProperty("--accent-shadow", theme.shadow);
    }

    function getWrappedImageIndex(index, imageCount) {
      return (index + imageCount) % imageCount;
    }

    function getProjectById(projectId) {
      return config.pages.projects.items.find((item) => item.id === projectId) || null;
    }

    function getProjectElement(projectId) {
      return Array.from(document.querySelectorAll(".project-item[data-project-id]"))
        .find((projectElement) => projectElement.dataset.projectId === projectId) || null;
    }

    function setExpandedProject(projectId) {
      const nextId = state.expandedProjectId === projectId ? null : projectId;
      state.expandedProjectId = nextId;

      document.querySelectorAll(".project-item[data-project-id]").forEach((projectElement) => {
        const isExpanded = projectElement.dataset.projectId === nextId;
        projectElement.classList.toggle("is-expanded", isExpanded);
        projectElement.querySelector("[data-project-toggle]")?.setAttribute("aria-expanded", String(isExpanded));
        const detail = projectElement.querySelector("[data-project-detail]");
        if (detail) detail.hidden = !isExpanded;
      });
    }

    function focusProject(projectId) {
      const project = getProjectById(projectId);
      const projectElement = getProjectElement(projectId);
      if (!project || !projectElement) return;

      if (state.expandedProjectId !== projectId) {
        setExpandedProject(projectId);
      }
      const headerHeight = document.querySelector(".site-header")?.getBoundingClientRect().height || 0;
      const targetTop = projectElement.getBoundingClientRect().top + window.scrollY - headerHeight;
      window.scrollTo({
        top: Math.max(0, targetTop),
        left: 0,
        behavior: "smooth"
      });
    }

    function setProjectImage(projectId, direction) {
      const project = getProjectById(projectId);
      const images = getProjectImages(project);
      const projectElement = getProjectElement(projectId);
      if (!project || !images.length || !projectElement) return;

      const currentIndex = getWrappedImageIndex(state.projectImageIndexes[projectId] || 0, images.length);
      state.projectImageIndexes[projectId] = getWrappedImageIndex(currentIndex + direction, images.length);
      const detail = projectElement.querySelector("[data-project-detail]");
      if (!detail) return;

      detail.innerHTML = renderProjectDetail(project);
      bindImageFallbacks(detail);
    }

    function scrollToPageTop() {
      window.scrollTo({
        top: 0,
        left: 0
      });
      syncHeaderScrollState();
    }

    function showContactHoverPreview(strip, row) {
      const previewId = row.dataset.contactPreviewTarget;
      const preview = Array.from(strip.querySelectorAll("[data-contact-preview]"))
        .find((item) => item.dataset.contactPreview === previewId);
      if (!preview) return;

      const stripRect = strip.getBoundingClientRect();
      const rowRect = row.getBoundingClientRect();
      preview.style.setProperty("--contact-preview-x", `${rowRect.left - stripRect.left + (rowRect.width / 2)}px`);
      strip.querySelectorAll("[data-contact-preview]").forEach((item) => {
        const isCurrent = item === preview;
        item.classList.toggle("is-visible", isCurrent);
        item.hidden = !isCurrent;
      });
    }

    function hideContactHoverPreviews(strip) {
      strip.querySelectorAll("[data-contact-preview]").forEach((item) => {
        item.classList.remove("is-visible");
        item.hidden = true;
      });
    }

    function syncHeaderScrollState() {
      header?.classList.toggle("is-scrolled", window.scrollY > 8);
    }

    function showView(viewId) {
      state.activeView = viewId;
      applyTheme(viewId);

      document.querySelectorAll(".nav-link").forEach((button) => {
        const isCurrent = button.dataset.target === viewId;
        button.classList.toggle("is-active", isCurrent);
        button.setAttribute("aria-current", isCurrent ? "page" : "false");
      });

      document.querySelectorAll(".view").forEach((view) => {
        const isCurrent = view.dataset.view === viewId;
        view.classList.toggle("is-active", isCurrent);
        view.hidden = !isCurrent;
      });

      scrollToPageTop();
    }

    function bindEvents() {
      window.addEventListener("scroll", syncHeaderScrollState, { passive: true });
      window.addEventListener("pageshow", scrollToPageTop);

      document.querySelectorAll(".nav-link").forEach((button) => {
        button.addEventListener("click", () => showView(button.dataset.target));
      });

      document.querySelectorAll("[data-view-link]").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          showView(link.dataset.viewLink);
        });
      });

      const projectsView = document.querySelector('[data-view="projects"]');
      projectsView?.addEventListener("click", (event) => {
        const imageButton = event.target.closest("[data-project-image]");
        if (imageButton) {
          setProjectImage(imageButton.dataset.carouselProjectId, imageButton.dataset.projectImage === "next" ? 1 : -1);
          return;
        }

        const featuredButton = event.target.closest("[data-featured-target]");
        if (featuredButton) {
          focusProject(featuredButton.dataset.featuredTarget);
          return;
        }

        const summaryButton = event.target.closest("[data-project-toggle]");
        if (summaryButton) {
          setExpandedProject(summaryButton.dataset.projectToggle);
        }
      });

      const contactsStrip = document.querySelector("[data-links-contacts]");
      contactsStrip?.querySelectorAll("[data-contact-row]").forEach((row) => {
        row.addEventListener("pointerenter", () => showContactHoverPreview(contactsStrip, row));
        row.addEventListener("pointerleave", () => hideContactHoverPreviews(contactsStrip));
        row.addEventListener("focusin", () => showContactHoverPreview(contactsStrip, row));
        row.addEventListener("focusout", () => hideContactHoverPreviews(contactsStrip));
      });

      document.querySelectorAll('[data-disabled="true"]').forEach((link) => {
        link.addEventListener("click", (event) => event.preventDefault());
      });
    }

    function bindImageFallbacks(scope = document) {
      scope.querySelectorAll("img[data-fallback]").forEach((image) => {
        image.addEventListener("error", () => {
          image.hidden = true;
        });
      });
    }

    function buildWavePath(width, height, baseY, amplitude, frequency, phase, drift, sampleCount = 36) {
      const points = [];

      for (let index = 0; index <= sampleCount; index += 1) {
        const x = (width / sampleCount) * index;
        const progress = index / sampleCount;
        const main = Math.sin((progress * Math.PI * 2 * frequency) + phase);
        const micro = Math.sin((progress * Math.PI * 4.2) + phase * 1.35 + drift);
        const pulse = Math.sin((progress * Math.PI * 1.2) + phase * 0.45);
        const y = baseY + main * amplitude + micro * (amplitude * 0.25) + pulse * (amplitude * 0.14);
        points.push([x, y]);
      }

      let path = `M ${points[0][0].toFixed(2)} ${points[0][1].toFixed(2)}`;

      for (let index = 1; index < points.length; index += 1) {
        const previous = points[index - 1];
        const current = points[index];
        const midX = ((previous[0] + current[0]) / 2).toFixed(2);
        const midY = ((previous[1] + current[1]) / 2).toFixed(2);
        path += ` Q ${previous[0].toFixed(2)} ${previous[1].toFixed(2)} ${midX} ${midY}`;
      }

      path += ` T ${points[points.length - 1][0].toFixed(2)} ${points[points.length - 1][1].toFixed(2)}`;
      path += ` L ${width} ${height} L 0 ${height} Z`;
      return path;
    }

    function updateWavePaths(timeMs = 0) {
      const waveRoot = document.querySelector(".wave-divider");
      if (!waveRoot) return;

      const width = 1200;
      const height = 100;
      const time = timeMs / 1000;
      const backFill = waveRoot.querySelector('[data-wave="back"]');
      const frontFill = waveRoot.querySelector('[data-wave="front"]');

      const backPhase = time * 1.05;
      const frontPhase = time * 1.34 + 1.2;

      const backPath = buildWavePath(width, height, 55.5, 5.0, 1.2, backPhase, time * 0.34);
      const frontPath = buildWavePath(width, height, 60.5, 3.4, 1.5, frontPhase, time * 0.42);

      if (backFill) backFill.setAttribute("d", backPath);
      if (frontFill) frontFill.setAttribute("d", frontPath);
    }

    function startWaveAnimation() {
      if (waveAnimationFrame) {
        window.cancelAnimationFrame(waveAnimationFrame);
        waveAnimationFrame = 0;
      }

      updateWavePaths(0);

      const mediaQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (mediaQuery.matches) {
        return;
      }

      const tick = (timeMs) => {
        updateWavePaths(timeMs);
        waveAnimationFrame = window.requestAnimationFrame(tick);
      };

      waveAnimationFrame = window.requestAnimationFrame(tick);
    }

    function renderApp() {
      renderNav();
      app.innerHTML = [
        renderHomeView(config.pages.home),
        renderProjectsView(config.pages.projects),
        renderLinksView(config.pages.links)
      ].join("");
      bindImageFallbacks();
      bindEvents();
      showView(state.activeView);
      syncHeaderScrollState();
      startWaveAnimation();
    }

    renderApp();
  </script>
</body>
</html>
