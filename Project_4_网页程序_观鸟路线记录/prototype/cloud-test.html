<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云开发连通自检 · 观鸟路线记录</title>
  <!-- 先加载唯一配置源，再加载已下载到本地的 CloudBase Web SDK（v2.28.8） -->
  <script src="js/config.js"></script>
  <script src="vendor/cloudbase/cloudbase.full.js"></script>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0 auto; padding: 16px; max-width: 560px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6f3; color: #1f2a23; line-height: 1.5;
    }
    h1 { font-size: 20px; margin: 0 0 4px; color: #1f5132; }
    .sub { margin: 0 0 16px; color: #5b6b60; font-size: 13px; }
    fieldset { border: 1px solid #d4ddd5; border-radius: 8px; margin: 0 0 14px; padding: 12px; }
    legend { color: #1f5132; font-weight: 700; font-size: 14px; padding: 0 6px; }
    label { display: block; font-size: 13px; margin: 8px 0 2px; color: #3a4a40; }
    input { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #c5cfc7; border-radius: 6px; font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button { padding: 9px 12px; border: 1px solid #1f5132; border-radius: 6px; background: #1f5132; color: #fff; font-size: 14px; cursor: pointer; }
    button.ghost { background: #fff; color: #1f5132; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #log { background: #11201a; color: #c9f0d6; border-radius: 8px; padding: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; min-height: 160px; max-height: 50vh; overflow: auto; }
    .ok { color: #7ee2a0; }
    .err { color: #ff9b8a; }
    .dim { color: #8aa394; }
  </style>
</head>
<body>
  <h1>云开发连通自检</h1>
  <p class="sub">验证后端是否打通：登录（匿名 / 邮箱验证码）→ 往云数据库写一条 → 读回来。此页面与主原型相互独立。</p>

  <fieldset>
    <legend>1. 登录</legend>

    <label for="email">邮箱（验证码登录）</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
    <div class="row">
      <button id="btnSendOtp">① 发送邮箱验证码</button>
      <button class="ghost" id="btnAnon">匿名登录（最省事）</button>
    </div>

    <label for="otp">邮箱收到的验证码</label>
    <input id="otp" type="text" inputmode="numeric" placeholder="粘贴邮件里的验证码" autocomplete="one-time-code" />
    <div class="row">
      <button id="btnVerifyOtp">② 验证并登录</button>
      <button class="ghost" id="btnWho">当前用户</button>
      <button class="ghost" id="btnSignOut">退出登录</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>2. 数据库读写（集合：smoke_test）</legend>
    <label for="msg">要写入的一句话</label>
    <input id="msg" type="text" placeholder="hello cloudbase" value="hello cloudbase" />
    <div class="row">
      <button id="btnWrite">写一条</button>
      <button class="ghost" id="btnRead">读最近 5 条</button>
    </div>
  </fieldset>

  <div id="log"></div>

  <script>
    (function () {
      var logEl = document.getElementById('log');
      function log(msg, cls) {
        var line = document.createElement('div');
        if (cls) line.className = cls;
        var t = new Date();
        var p = function (n) { return String(n).padStart(2, '0'); };
        line.textContent = '[' + p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds()) + '] ' + msg;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }
      function show(obj) { try { return JSON.stringify(obj); } catch (e) { return String(obj); } }
      // 统一打印 {data, error} 风格的错误；返回 true 表示有错误（应中止）
      function failed(name, error) {
        if (!error) return false;
        var msg = error.message || error.error_description || error.error || show(error);
        log('✗ ' + name + ' 失败：' + msg, 'err');
        if (error.code || error.error) log('  错误码：' + (error.code || error.error), 'err');
        return true;
      }

      if (typeof cloudbase === 'undefined') { log('未找到 cloudbase（SDK 未加载成功）。', 'err'); return; }
      var envId = window.CONFIG && window.CONFIG.cloud && window.CONFIG.cloud.envId;
      if (!envId) { log('CONFIG.cloud.envId 缺失，请检查 js/config.js。', 'err'); return; }

      var app = cloudbase.init({ env: envId });
      var auth = app.auth({ persistence: 'local' });
      var db = app.database();
      log('SDK 已初始化，环境 ID = ' + envId, 'dim');
      log('邮箱登录两步：先「①发送验证码」→ 查收邮件 → 填验证码 →「②验证并登录」。', 'dim');

      // 保存「①发送验证码」后返回的 verifyOtp 回调，供第②步使用
      var pendingVerifyOtp = null;

      // 把会抛异常的调用也兜住
      function guard(name, fn) {
        return async function () {
          try { await fn(); }
          catch (e) { log('✗ ' + name + ' 异常：' + (e && e.message ? e.message : show(e)), 'err'); }
        };
      }

      function getEmail() { return document.getElementById('email').value.trim(); }
      function getOtp() { return document.getElementById('otp').value.trim(); }

      document.getElementById('btnSendOtp').onclick = guard('发送验证码', async function () {
        var email = getEmail();
        if (!email) { log('请先填写邮箱。', 'err'); return; }
        log('→ 发送验证码到 ' + email + ' …', 'dim');
        var res = await auth.signInWithOtp({ email: email });
        if (failed('发送验证码', res && res.error)) return;
        pendingVerifyOtp = res.data && res.data.verifyOtp;
        if (typeof pendingVerifyOtp !== 'function') { log('✗ 未拿到 verifyOtp 回调，返回：' + show(res), 'err'); return; }
        log('✓ 验证码已发送，请查收邮箱（含垃圾箱），把验证码填到下面。', 'ok');
      });

      document.getElementById('btnVerifyOtp').onclick = guard('验证并登录', async function () {
        if (typeof pendingVerifyOtp !== 'function') { log('请先点「①发送邮箱验证码」。', 'err'); return; }
        var token = getOtp();
        if (!token) { log('请先填写收到的验证码。', 'err'); return; }
        log('→ 校验验证码 …', 'dim');
        var res = await pendingVerifyOtp({ token: token });
        if (failed('验证并登录', res && res.error)) return;
        var u = (res.data && res.data.user) || {};
        log('✓ 邮箱登录成功：uid=' + (u.uid || '?') + ' email=' + (u.email || getEmail()), 'ok');
        pendingVerifyOtp = null;
      });

      document.getElementById('btnAnon').onclick = guard('匿名登录', async function () {
        await auth.signInAnonymously();
        log('✓ 匿名登录成功', 'ok');
      });

      document.getElementById('btnWho').onclick = guard('查询当前用户', async function () {
        var state = await auth.getLoginState();
        if (!state) { log('当前未登录。', 'dim'); return; }
        var u = state.user || {};
        log('✓ 已登录。用户对象的基本类型字段如下（用于确定唯一标识）：', 'ok');
        var keys = [];
        for (var k in u) { keys.push(k); }
        keys.forEach(function (k) {
          var v;
          try { v = u[k]; } catch (e) { return; }
          var t = (v === null) ? 'null' : typeof v;
          if (t === 'string' || t === 'number' || t === 'boolean' || t === 'null') {
            log('  ' + k + ' = ' + v);
          } else {
            log('  ' + k + ' : [' + t + ']');
          }
        });
        // 重点候选字段单独再打一遍，便于一眼看到
        log('候选标识：uid=' + u.uid + ' sub=' + u.sub + ' _id=' + u._id + ' customUserId=' + u.customUserId + ' openid=' + u.openid + ' userId=' + u.userId, 'dim');
      });

      document.getElementById('btnSignOut').onclick = guard('退出登录', async function () {
        await auth.signOut();
        log('✓ 已退出登录', 'ok');
      });

      document.getElementById('btnWrite').onclick = guard('写一条数据', async function () {
        var res = await db.collection('smoke_test').add({
          msg: document.getElementById('msg').value,
          createdAt: db.serverDate ? db.serverDate() : new Date(),
          ua: navigator.userAgent
        });
        log('✓ 写入成功，文档 ID = ' + (res.id || res._id || show(res)), 'ok');
      });

      document.getElementById('btnRead').onclick = guard('读取数据', async function () {
        var res = await db.collection('smoke_test').orderBy('createdAt', 'desc').limit(5).get();
        var rows = res.data || [];
        log('✓ 读到 ' + rows.length + ' 条：', 'ok');
        rows.forEach(function (r, i) { log('  ' + (i + 1) + '. ' + (r.msg || '(空)') + '  [' + (r._id || '') + ']'); });
      });
    })();
  </script>
</body>
</html>
