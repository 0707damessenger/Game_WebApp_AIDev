<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spellatoon | 对局原型</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="start-toast" id="start-toast" role="status" aria-live="assertive" hidden>
      <div class="start-toast-content">
        <span class="start-toast-kicker">本局先手</span>
        <strong id="start-toast-message"></strong>
      </div>
    </div>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">LOCAL DUEL / PUBLIC BOARD</p>
          <h1>Spellatoon</h1>
        </div>
        <div class="header-stats" id="header-stats" aria-label="对局信息">
          <div class="turn-chip" id="turn-chip" aria-live="polite">第 1 回合</div>
          <div class="timer-chip" aria-label="行动倒计时"><span id="turn-timer">30s</span></div>
          <div class="score-strip" aria-label="双方分数">
            <span class="score-strip-label">比分</span>
            <div class="player-list" id="player-list"></div>
          </div>
          <div class="status-pill"><span class="status-dot"></span><span id="connection-status">本地原型</span></div>
        </div>
      </header>

      <section class="lobby-panel" id="lobby-panel" aria-label="局域网房间">
        <span class="lobby-status" id="lobby-status"></span>
        <div class="lobby-controls">
          <button class="action-button" type="button" id="create-room">创建房间</button>
          <input class="room-input" id="room-id-input" aria-label="四位数字房间号" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="四位房间号" />
          <button class="action-button" type="button" id="join-room">加入房间</button>
          <button class="action-button secondary" type="button" id="start-game" disabled>开始对局</button>
        </div>
        <p class="room-info" id="room-info" hidden></p>
      </section>

      <div id="game-view">
      <section class="board-section" aria-label="战场棋盘">
        <div class="board-frame">
          <div class="board" id="board" aria-label="公共棋盘"></div>
        </div>
        <aside class="preview-panel" aria-live="polite">
          <span class="preview-label">PREVIEW</span>
          <span id="preview-message">悬停棋盘空格开始预览</span>
        </aside>
      </section>

      <section class="console-section" aria-label="本地手牌与回合操作">
        <section class="hand-panel" id="hand-panel" aria-label="本地手牌">
            <div class="hand-heading">
              <div class="panel-label">我的手牌</div>
              <div class="hand-actions">
                <span class="hand-count" id="hand-count"></span>
                <button class="action-button end-turn" type="button" id="end-turn">结束回合</button>
              </div>
            </div>
            <div class="hand" id="hand"></div>
            <div class="hand-overlay" id="hand-overlay" hidden>对方行动中</div>
        </section>
      </section>
      </div>
    </main>
    <div class="game-toast" id="game-toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./js/app.mjs"></script>
  </body>
</html>
