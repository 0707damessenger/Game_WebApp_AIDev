<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spellatoon | 对局原型</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">LOCAL DUEL / PUBLIC BOARD</p>
          <h1>Spellatoon</h1>
        </div>
        <div class="turn-chip" id="turn-chip" aria-live="polite">准备进入对局</div>
      </header>

      <section class="lobby-panel" id="lobby-panel" aria-labelledby="lobby-heading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">局域网房间</p>
            <h2 id="lobby-heading">连接另一台设备</h2>
          </div>
          <span class="lobby-status" id="lobby-status">创建房间开始</span>
        </div>
        <div class="lobby-controls">
          <button class="action-button" type="button" id="create-room">创建房间</button>
          <label class="room-input-label" for="room-id-input">房间号</label>
          <input class="room-input" id="room-id-input" autocomplete="off" placeholder="粘贴房间号" />
          <button class="action-button" type="button" id="join-room">加入房间</button>
          <button class="action-button secondary" type="button" id="start-game" disabled>开始对局</button>
        </div>
        <p class="room-info" id="room-info">创建后把房间号和本页面地址交给另一名玩家。</p>
      </section>

      <div id="game-view">
      <section class="board-section" aria-labelledby="board-heading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">公共区域</p>
            <h2 id="board-heading">战场棋盘</h2>
          </div>
          <p class="board-meta" id="board-meta">6 × 6 · 所有部署信息公开</p>
        </div>
        <div class="board-frame">
          <div class="board" id="board" aria-label="公共 6x6 棋盘"></div>
        </div>
        <aside class="preview-panel" aria-live="polite">
          <span class="preview-label">PREVIEW</span>
          <span id="preview-message">悬停棋盘空格开始预览</span>
        </aside>
      </section>

      <section class="console-section" aria-labelledby="console-heading">
        <div class="section-heading console-heading">
          <div>
            <p class="section-kicker">本地控制台</p>
            <h2 id="console-heading">当前对局</h2>
          </div>
          <div class="status-pill"><span class="status-dot"></span><span id="connection-status">本地原型</span></div>
        </div>

        <div class="console-grid">
          <section class="status-panel" aria-label="状态信息">
            <div class="panel-label">状态</div>
            <p class="status-message" id="status-message"></p>
            <div class="status-stats">
              <div><span>回合</span><strong id="turn-number"></strong></div>
              <div><span>先手</span><strong id="starter-name"></strong></div>
              <div><span>玩家</span><strong id="local-player-name"></strong></div>
            </div>
            <p class="result-message" id="result-message"></p>
          </section>

          <section class="players-panel" aria-label="双方公开信息">
            <div class="panel-label">双方角色</div>
            <div class="player-list" id="player-list"></div>
          </section>

          <section class="hand-panel" aria-label="本地手牌">
            <div class="hand-heading">
              <div class="panel-label">我的手牌</div>
              <span class="hand-count" id="hand-count"></span>
            </div>
            <div class="hand" id="hand"></div>
          </section>

          <section class="action-panel" id="action-controls" aria-label="行动控制">
            <div class="panel-label">行动</div>
            <div class="action-controls">
              <button class="action-button" type="button" data-mode="move" id="move-mode">移动</button>
              <button class="action-button" type="button" data-mode="deploy" id="deploy-mode">部署</button>
              <button class="action-button secondary" type="button" id="confirm-action">确认移动</button>
              <button class="action-button ghost" type="button" id="clear-selection">清除选择</button>
              <button class="action-button end-turn" type="button" id="end-turn">结束回合</button>
            </div>
            <p class="action-hint" id="action-hint">选择一张手牌开始行动</p>
          </section>
        </div>

        <aside class="event-panel" aria-live="polite">
          <span class="event-mark">EVENT</span>
          <span id="event-message"></span>
        </aside>
      </section>
      </div>
    </main>
    <script type="module" src="./js/app.mjs"></script>
  </body>
</html>
